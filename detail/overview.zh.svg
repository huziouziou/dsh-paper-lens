<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Paper Lens: a PDF in the right sidebar with selected text, a translation bubble and an annotation highlight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="640" height="300" rx="16" fill="url(#bg)"/>

  <!-- left: chat column -->
  <g filter="url(#shadow)">
    <rect x="22" y="34" width="286" height="232" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <circle cx="42" cy="54" r="7" fill="#c7d5ea"/>
  <rect x="56" y="49" width="120" height="10" rx="5" fill="#d5dfec"/>
  <rect x="40" y="78" width="236" height="9" rx="4.5" fill="#e3e9f2"/>
  <rect x="40" y="94" width="210" height="9" rx="4.5" fill="#e3e9f2"/>
  <rect x="40" y="110" width="180" height="9" rx="4.5" fill="#e3e9f2"/>
  <rect x="40" y="136" width="236" height="9" rx="4.5" fill="#e8edf5"/>
  <rect x="40" y="152" width="150" height="9" rx="4.5" fill="#e8edf5"/>
  <!-- quote block inside chat -->
  <rect x="40" y="178" width="238" height="30" rx="6" fill="#eef4ff" stroke="#cddcf5"/>
  <rect x="48" y="183" width="4" height="20" rx="2" fill="#4f8cf7"/>
  <rect x="60" y="186" width="120" height="7" rx="3.5" fill="#b8cdf0"/>
  <rect x="60" y="198" width="90" height="7" rx="3.5" fill="#c9d8f2"/>
  <rect x="40" y="226" width="200" height="9" rx="4.5" fill="#e3e9f2"/>
  <rect x="40" y="242" width="140" height="9" rx="4.5" fill="#e3e9f2"/>

  <!-- right: pdf sidebar -->
  <g filter="url(#shadow)">
    <rect x="330" y="24" width="288" height="252" rx="12" fill="#fbfcfe" stroke="#dbe3ee"/>
  </g>
  <rect x="330" y="24" width="288" height="28" rx="12" fill="#eef3fb"/>
  <rect x="330" y="42" width="288" height="10" fill="#eef3fb"/>
  <circle cx="346" cy="38" r="4" fill="#f7a1a1"/>
  <circle cx="360" cy="38" r="4" fill="#f8cf8f"/>
  <circle cx="374" cy="38" r="4" fill="#9fd8aa"/>
  <rect x="392" y="33" width="86" height="10" rx="5" fill="#d3deee"/>
  <rect x="556" y="33" width="46" height="10" rx="5" fill="#e2eaf5"/>

  <!-- pdf page -->
  <g>
    <rect x="352" y="64" width="248" height="196" rx="6" fill="url(#page)" stroke="#e2e8f2"/>
    <rect x="368" y="78" width="150" height="8" rx="4" fill="#c9d5e6"/>
    <rect x="368" y="96" width="216" height="6" rx="3" fill="#e6ecf5"/>
    <rect x="368" y="108" width="216" height="6" rx="3" fill="#e6ecf5"/>
    <rect x="368" y="120" width="190" height="6" rx="3" fill="#e6ecf5"/>
    <!-- selection -->
    <rect x="366" y="133" width="220" height="9" rx="3" fill="#ffe9a8"/>
    <rect x="366" y="145" width="196" height="9" rx="3" fill="#ffe9a8"/>
    <rect x="366" y="157" width="120" height="9" rx="3" fill="#ffe9a8"/>
    <rect x="368" y="174" width="216" height="6" rx="3" fill="#e6ecf5"/>
    <rect x="368" y="186" width="216" height="6" rx="3" fill="#e6ecf5"/>
    <rect x="368" y="198" width="170" height="6" rx="3" fill="#e6ecf5"/>
    <!-- annotation highlight (green) -->
    <rect x="366" y="212" width="200" height="9" rx="3" fill="#b8e6c4"/>
    <rect x="366" y="224" width="150" height="9" rx="3" fill="#b8e6c4"/>
    <rect x="366" y="240" width="216" height="6" rx="3" fill="#e6ecf5"/>
  </g>

  <!-- floating toolbar -->
  <g filter="url(#shadow)">
    <rect x="440" y="176" width="132" height="30" rx="8" fill="#ffffff" stroke="#dbe3ee"/>
  </g>
  <rect x="452" y="187" width="30" height="9" rx="4.5" fill="#4f8cf7"/>
  <rect x="490" y="187" width="30" height="9" rx="4.5" fill="#dbe6f6"/>
  <circle cx="536" cy="191" r="6" fill="#ffd166"/>
  <circle cx="556" cy="191" r="6" fill="#8ecae6"/>

  <!-- translation bubble -->
  <g filter="url(#shadow)">
    <rect x="352" y="6" width="248" height="0" rx="8" fill="#ffffff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="404" y="212" width="196" height="40" rx="10" fill="#ffffff" stroke="#cfe0fb"/>
  </g>
  <rect x="416" y="222" width="168" height="7" rx="3.5" fill="#9fc0ee"/>
  <rect x="416" y="235" width="140" height="7" rx="3.5" fill="#b9d0f1"/>

  <!-- annotation color dots -->
  <g>
    <circle cx="596" cy="96" r="6" fill="#ffe9a8" stroke="#e8c96a"/>
    <circle cx="596" cy="116" r="6" fill="#ffb4a2" stroke="#e08e79"/>
    <circle cx="596" cy="136" r="6" fill="#8ecae6" stroke="#5aa9c9"/>
    <circle cx="596" cy="156" r="6" fill="#b8e6c4" stroke="#7cbf8e"/>
  </g>
</svg>
